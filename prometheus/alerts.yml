groups:
  - name: service-alerts
    rules:
      - alert: ServiceDown
        expr: probe_success{job="health-checks"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} health check is failing"
          description: "The /health endpoint for {{ $labels.service }} has returned non-200 for over one minute."

      - alert: HighErrorRate
        expr: |
          (
            sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))
            /
            sum by (job) (rate(http_requests_total[5m]))
          ) > 0.05
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate for {{ $labels.job }}"
          description: "More than 5% of requests for {{ $labels.job }} returned 5xx responses over the last five minutes."

      - alert: ServiceNotScraping
        expr: up{job=~"order-service|tracking-service|notification-service"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }}"
          description: "Prometheus has failed to scrape {{ $labels.job }} for over two minutes."
